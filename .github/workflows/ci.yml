# BONUS — CI/CD với GitHub Actions
#
#   push / pull_request ──► test ─┐
#                                 ├──► deploy (chỉ push lên main) ──► smoke test
#                         build ──┘
#
# Secret/biến cần có trong repo → Settings → Secrets and variables → Actions:
#   secrets.RAILWAY_TOKEN   project token của Railway (chỉ có quyền trên project này)
#   vars.RAILWAY_SERVICE    tên service app trên Railway
#   vars.PUBLIC_URL         URL công khai của service, dùng cho smoke test

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Mỗi nhánh một hàng đợi: không có hai lần deploy chạy chồng lên nhau. PR thì
# hủy lần chạy cũ cho nhanh; main thì KHÔNG hủy — hủy giữa chừng một lần
# deploy có thể để lại bản build dở trên Railway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (CP1–CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # test_cp5 gọi vào bản deploy đang sống, test_bonus_cicd kiểm tra badge
      # của chính workflow này; test build Docker (-m docker) để job build lo.
      - name: Run pytest
        env:
          AGENT_API_KEY: ci-dummy-key
          REDIS_URL: "fake://"
        run: >
          pytest tests/ -v
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py
          -m "not docker"

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t day12-agent:ci .

      - name: Smoke test container
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy-key -e REDIS_URL=fake:// day12-agent:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs agent
          exit 1

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.62.1

      # `railway up --ci` chỉ chờ BUILD xong rồi thoát; bản mới còn phải qua
      # healthcheck mới thay bản cũ. Không chờ bước đó thì smoke test phía sau
      # gọi trúng bản CŨ và báo xanh cho một bản deploy có thể đang hỏng.
      - name: Deploy and wait until the new deployment is live
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ vars.RAILWAY_SERVICE }}
        # GitHub chạy script bằng `bash -e`: một lệnh trả mã khác 0 là job dừng
        # ngay. `read` gặp EOF (API Railway chập chờn, không in ra gì) trả 1, nên
        # mọi `read` đều kèm `|| true` và kết quả rỗng được coi là "thử lại".
        run: |
          latest() {
            # In "<id> <status>" của deployment mới nhất; in rỗng nếu API lỗi.
            railway deployment list --service "$SERVICE" --limit 1 --json 2>/dev/null \
              | python3 -c 'import json, sys
          try:
              d = json.load(sys.stdin)
          except ValueError:
              sys.exit(0)
          print(d[0]["id"], d[0]["status"]) if d else print("none none")' || true
          }

          # Không biết deployment hiện tại thì không phân biệt được bản mới với
          # bản cũ → dừng (đỏ) thay vì đoán, tránh báo xanh sai.
          before=""
          for i in $(seq 1 5); do
            read -r before _ < <(latest) || true
            [ -n "$before" ] && break
            sleep 3
          done
          if [ -z "$before" ]; then
            echo "không đọc được deployment hiện tại từ Railway"
            exit 1
          fi
          echo "deployment trước khi deploy: $before"

          railway up --ci --service "$SERVICE"

          for i in $(seq 1 60); do
            id=""; status=""
            read -r id status < <(latest) || true
            if [ -z "$id" ]; then
              echo "Railway API chưa trả lời, thử lại"
              sleep 5
              continue
            fi
            echo "deployment mới nhất: $id -> $status"
            if [ "$id" != "$before" ]; then
              case "$status" in
                SUCCESS) exit 0 ;;
                FAILED|CRASHED|REMOVED|SKIPPED) exit 1 ;;
              esac
            fi
            sleep 5
          done
          echo "hết thời gian chờ deployment mới"
          exit 1

      - name: Smoke test
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          for i in $(seq 1 20); do
            curl -fsS "$PUBLIC_URL/health" && break
            sleep 6
          done
          curl -fsS "$PUBLIC_URL/health"
          curl -fsS "$PUBLIC_URL/ready"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$PUBLIC_URL/ask" \
            -H "Content-Type: application/json" -d '{"question":"ci"}')
          echo "/ask without key -> $code"
          test "$code" = "401"
